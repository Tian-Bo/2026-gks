server {
    listen 80;
    server_name your-api-domain.example.com;

    # Replace this with the absolute path of this project's backend/public directory.
    root /www/wwwroot/kl-ai/backend/public;
    index index.php;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        # Change the socket path if your PHP 8.0-FPM installation uses another one.
        fastcgi_pass unix:/run/php/php8.0-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
